---
# tasks file for roles/ntp

- name: Install NTP
  ansible.builtin.package:
    name: "{{ ntp_package }}"
    state: present
    update_cache: true

- name: Configure chrony
  ansible.builtin.template: 
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable and start chrony
  ansible.builtin.service:
    name: "{{ ntp_service }}"
    enabled: true
    state: started
