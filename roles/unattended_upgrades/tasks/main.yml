---
# tasks file for roles/unattended_upgrades
- name: Install unattended-upgrades
  apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Configure Security repo
  copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern {
         "origin=Debian,codename=${distro_codename},label=Debian-Security"
         "origin=Ubuntu,codename=${distro_codename}-security";
      };

      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "{{ auto_reboot | bool | ternary('true', 'false') }}";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ auto_reboot_time }}";
  when: ansible_facts['distribution'] == 'Ubuntu'
  notify: Restart unattended-upgrades

- name: Enable automatic updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "{{ security_auto_updates | bool | ternary('1', '0') }}";
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Enable unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started
