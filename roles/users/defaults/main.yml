---
# defaults file for roles/users

# Users that should be created. Override in group_vars/host_vars per environment.
users:
  - name: deployer
    groups: []
    sudo: true

# Whether sudo access for users flagged sudo: true is passwordless (NOPASSWD:ALL)
# or requires a password (ALL). Passwordless is convenient for labs/automation;
# set to false for production hosts unless you have a specific reason not to.
users_sudo_nopasswd: true

# SSH public keys, keyed by username.
user_ssh_keys:
  deployer: ""
