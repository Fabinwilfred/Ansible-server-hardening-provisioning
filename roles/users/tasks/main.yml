---
# tasks file for roles/users and home directory
- name: Add user accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    create_home: true
    home: "/home/{{ item.name }}"
    groups: "{{ item.groups }}"
    password: "{{ item.password | password_hash('sha512') if item.password else omit }}"
    update_password: on_create
    append: true
    state: present
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Add SSH public key
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ user_ssh_keys[item.name] }}"
    state: present
    manage_dir: true
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - user_ssh_keys[item.name] is defined
    - user_ssh_keys[item.name] | length > 0

# Create sudoers configuration for sudo users
- name: Configure sudo access
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  loop: "{{ users | selectattr('sudo', 'defined') | selectattr('sudo', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.name }}"

# Add sudo users to sudo group
- name: Add sudo users to sudo group
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups:
      - sudo
    append: true
  loop: "{{ users | selectattr('sudo', 'defined') | selectattr('sudo', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.name }}"
